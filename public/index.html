<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Voice Lounge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #111827;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 95vh;
            position: relative;
        }
        .tab-view {
            display: none;
            flex-direction: column;
            height: calc(100% - 60px);
            overflow-y: auto;
            text-align: left;
            padding-bottom: 20px;
        }
        .tab-view.active { display: flex; }
        .profile-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ec4899;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #f472b6;
        }
        .user-details h4 { margin: 0; font-size: 14px; }
        .user-details span { font-size: 11px; color: #f59e0b; font-weight: bold; }
        .wallet-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .ludo-section {
            background: #1f2937;
            border: 1px solid #f59e0b;
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .ludo-btn {
            background: #f59e0b;
            color: #111827;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 14px;
        }
        .home-banner {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        #roomScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            flex-direction: column;
            z-index: 50;
            padding-bottom: 15px;
        }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-areas: "seat1 seat1" "seat2 seat3" "seat4 seat5";
            gap: 15px;
            text-align: center;
            margin: 15px auto;
            max-width: 250px;
        }
        .seat:nth-child(1) { grid-area: seat1; }
        .seat:nth-child(2) { grid-area: seat2; }
        .seat:nth-child(3) { grid-area: seat3; }
        .seat:nth-child(4) { grid-area: seat4; }
        .seat:nth-child(5) { grid-area: seat5; }
        .seat-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #1f2937;
            border: 2px dashed #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .seat-circle.occupied { background: #ec4899; border: 2px solid #f472b6; }
        .seat-name { font-size: 12px; color: #9ca3af; display: block; }
        .chat-box {
            flex: 1;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 10px;
            border: 1px solid #374151;
            max-height: 200px;
        }
        .chat-msg {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 8px;
        }
        .chat-msg .sender { color: #f472b6; font-weight: bold; }
        .chat-msg.gift-msg { background: linear-gradient(90deg, #8b5cf6, #ec4899); color: #fff; font-weight: bold; }
        .chat-msg.game-msg { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; font-weight: bold; }
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        .controls input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .btn {
            background: #ec4899;
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .gift-btn { background: #8b5cf6; }
        .game-btn { background: #f59e0b; }
        .gift-menu {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 16px;
            padding: 12px;
            gap: 15px;
            z-index: 100;
        }
        .gift-item { font-size: 26px; cursor: pointer; }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #1f2937;
            border-top: 1px solid #374151;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
        }
        .nav-item {
            background: none;
            border: none;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            cursor: pointer;
        }
        .nav-item span { font-size: 16px; }
        .nav-item.active { color: #ec4899; font-weight: bold; }
    </style>
</head>
