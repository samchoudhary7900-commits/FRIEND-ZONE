<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Voice Lounge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #111827;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        
        /* Home Screen */
        #homeScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            gap: 20px;
        }
        .home-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        /* Room Screen (Initially Hidden) */
        #roomScreen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        /* 5 Seats Layout */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-areas:
                "seat1 seat1"
                "seat2 seat3"
                "seat4 seat5";
            gap: 15px;
            text-align: center;
            margin: 15px auto;
            max-width: 250px;
        }
        .seat:nth-child(1) { grid-area: seat1; }
        .seat:nth-child(2) { grid-area: seat2; }
        .seat:nth-child(3) { grid-area: seat3; }
        .seat:nth-child(4) { grid-area: seat4; }
        .seat:nth-child(5) { grid-area: seat5; }

        .seat-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #1f2937;
            border: 2px dashed #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .seat-circle.occupied {
            background: #ec4899;
            border: 2px solid #f472b6;
        }
        .seat-name {
            font-size: 12px;
            color: #9ca3af;
            display: block;
        }

        /* Chat Section */
        .chat-box {
            flex: 1;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 10px;
            border: 1px solid #374151;
            max-height: 200px;
        }
        .chat-msg {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
        }
        .chat-msg .sender { color: #f472b6; font-weight: bold; }
        .chat-msg.gift-msg { background: linear-gradient(90deg, #8b5cf6, #ec4899); color: #fff; font-weight: bold; }
        .chat-msg.game-msg { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; font-weight: bold; }

        /* Controls */
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .controls input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .btn {
            background: #ec4899;
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .gift-btn { background: #8b5cf6; }
        .game-btn { background: #f59e0b; }

        /* Gift Menu */
        .gift-menu {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 16px;
            padding: 12px;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .gift-item { font-size: 26px; cursor: pointer; transition: transform 0.2s; }
        .gift-item:hover { transform: scale(1.3); }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Home Screen -->
        <div id="homeScreen">
            <h2>🎙️ VIP Voice Lounge</h2>
            <div class="home-card">
                <h3>Welcome Home!</h3>
                <p style="font-size: 13px; color: #9ca3af; margin-bottom: 20px;">Click below to enter the live VIP Room.</p>
                <button class="btn" style="width: 100%; border-radius: 12px;" onclick="goToRoom()">🏠 Home / Enter Room</button>
            </div>
        </div>

        <!-- Room Screen -->
        <div id="roomScreen">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                <button class="btn" style="padding: 5px 12px; font-size: 12px; background: #374151;" onclick="goBackHome()">← Back</button>
                <h3 style="margin: 0;">🎙️ VIP Voice Room</h3>
                <div style="width: 50px;"></div>
            </div>
            
            <!-- 5 Seats Layout -->
            <div class="seat-grid">
                <div class="seat">
                    <div id="seat-1" class="seat-circle occupied">A</div>
                    <span id="seat-1-name" class="seat-name">Admin</span>
                </div>
                <div class="seat" onclick="claimSeat(2)">
                    <div id="seat-2" class="seat-circle">+</div>
                    <span id="seat-2-name" class="seat-name">Seat 2</span>
                </div>
                <div class="seat" onclick="claimSeat(3)">
                    <div id="seat-3" class="seat-circle">+</div>
                    <span id="seat-3-name" class="seat-name">Seat 3</span>
                </div>
                <div class="seat" onclick="claimSeat(4)">
                    <div id="seat-4" class="seat-circle">+</div>
                    <span id="seat-4-name" class="seat-name">Seat 4</span>
                </div>
                <div class="seat" onclick="claimSeat(5)">
                    <div id="seat-5" class="seat-circle">+</div>
                    <span id="seat-5-name" class="seat-name">Seat 5</span>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-box" id="chatBox">
                <div class="chat-msg">
                    <span class="sender">System:</span> Welcome to VIP Room! 🎉
                </div>
            </div>

            <!-- Gift Selector Popup -->
            <div class="gift-menu" id="giftMenu">
                <span class="gift-item" onclick="sendGift('🌹 Rose')">🌹</span>
                <span class="gift-item" onclick="sendGift('👑 Crown')">👑</span>
                <span class="gift-item" onclick="sendGift('🚀 Rocket')">🚀</span>
                <span class="gift-item" onclick="sendGift('🔥 Fire')">🔥</span>
            </div>

            <!-- Input Bar -->
            <div class="controls">
                <button class="btn gift-btn" onclick="toggleGiftMenu()">🎁</button>
                <button class="btn game-btn" onclick="rollDice()">🎲</button>
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="btn" onclick="sendMsg()">Send</button>
            </div>
        </div>

    </div>

    <script>
        let currentUser = "User_" + Math.floor(Math.random() * 900 + 100);

        function goToRoom() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('roomScreen').style.display = 'flex';
        }

        function goBackHome() {
            document.getElementById('roomScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        function sendMsg() {
            let input = document.getElementById('msgInput');
            let msg = input.value.trim();
            if(!msg) return;

            addChatMessage(currentUser, msg, false);
            input.value = '';
        }

        function toggleGiftMenu() {
            let menu = document.getElementById('giftMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendGift(giftName) {
            toggleGiftMenu();
            addChatMessage(currentUser, `sent ${giftName} to Admin! ✨`, true);
        }

        function rollDice() {
            let diceNum = Math.floor(Math.random() * 6) + 1;
            let diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            let face = diceFaces[diceNum - 1];
            
            let chatBox = document.getElementById('chatBox');
            let div = document.createElement('div');
            div.className = 'chat-msg game-msg';
            div.innerHTML = `🎲 <b>${currentUser}</b> rolled a dice and got <b>${diceNum}</b> ${face}!`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addChatMessage(sender, text, isGift) {
            let chatBox = document.getElementById('chatBox');
            let div = document.createElement('div');
            div.className = 'chat-msg' + (isGift ? ' gift-msg' : '');
            
            if(isGift) {
                div.innerHTML = `🎁 <b>${sender}</b> ${text}`;
            } else {
                div.innerHTML = `<span class="sender">${sender}:</span> ${text}`;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function claimSeat(seatNum) {
            let seat = document.getElementById(`seat-${seatNum}`);
            let name = document.getElementById(`seat-${seatNum}-name`);
            if(!seat.classList.contains('occupied')) {
                seat.classList.add('occupied');
                seat.innerText = currentUser.charAt(0);
                name.innerText = currentUser;
                addChatMessage("System", `${currentUser} took Seat ${seatNum}`, false);
            }
        }
    </script>
</body>
</html>
