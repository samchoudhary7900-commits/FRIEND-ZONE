<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Is The Spy - Party Game</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0f172a; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; background: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; color: #facc15; margin-bottom: 15px; }
        .card { background: #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #475569; }
        .btn { background: #10b981; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-secondary { background: #3b82f6; }
        .btn-danger { background: #ef4444; }
        
        .word-reveal-box { background: #0f172a; padding: 20px; border-radius: 10px; text-align: center; margin: 15px 0; border: 2px dashed #facc15; }
        .player-chip { background: #475569; padding: 8px 12px; border-radius: 20px; display: inline-block; margin: 4px; font-size: 12px; cursor: pointer; }
        .player-chip.selected { background: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        <h2>🕵️ Who Is The Spy?</h2>

        <!-- SETUP SCREEN -->
        <div id="screen-setup" class="card">
            <h3>Game Setup</h3>
            <label style="font-size: 12px; color: #9ca3af;">Total Players (3 to 8):</label>
            <input type="number" id="numPlayers" value="4" min="3" max="8" style="width: 100%; padding: 8px; margin: 6px 0 12px 0; background: #1e293b; border: 1px solid #475569; color: #fff; border-radius: 6px;">
            
            <label style="font-size: 12px; color: #9ca3af;">Number of Spies:</label>
            <input type="number" id="numSpies" value="1" min="1" max="2" style="width: 100%; padding: 8px; margin: 6px 0 12px 0; background: #1e293b; border: 1px solid #475569; color: #fff; border-radius: 6px;">
            
            <button class="btn" onclick="startGame()">Start Game 🚀</button>
        </div>

        <!-- REVEAL SCREEN -->
        <div id="screen-reveal" class="card" style="display: none; text-align: center;">
            <h3>Pass Phone to Player <span id="currentRevealPlayer">1</span></h3>
            <p style="font-size: 12px; color: #9ca3af;">Tap below to secretly check your word</p>
            
            <div class="word-reveal-box" id="secretBox" onclick="toggleWordVisibility()">
                <span id="secretText" style="font-size: 18px; font-weight: bold; color: #facc15;">🔒 Tap to Reveal</span>
            </div>
            
            <button class="btn btn-secondary" id="nextPlayerBtn" onclick="nextPlayerReveal()" style="display:none;">Next Player / Start Discussion</button>
        </div>

        <!-- DISCUSSION & VOTING SCREEN -->
        <div id="screen-game" class="card" style="display: none;">
            <h3>🗣️ Discussion & Voting</h3>
            <p style="font-size: 12px; color: #9ca3af;">Give clues one by one without saying your exact word. Then vote out the suspected Spy!</p>
            
            <div id="votingList" style="margin: 15px 0;"></div>
            
            <button class="btn btn-danger" onclick="submitVote()">Submit Vote 🗳️</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="screen-result" class="card" style="display: none; text-align: center;">
            <h3>🏆 Game Result</h3>
            <p id="resultText" style="font-size: 14px; margin: 15px 0;"></p>
            <button class="btn" onclick="resetGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const wordPairs = [
            { civilian: "Apple 🍎", spy: "Mango 🥭" },
            { civilian: "Coffee ☕", spy: "Tea 🍵" },
            { civilian: "Cricket 🏏", spy: "Football ⚽" },
            { civilian: "Car 🚗", spy: "Bus 🚌" }
        ];

        let totalPlayers = 4;
        let spiesCount = 1;
        let playersData = [];
        let currentPlayerIndex = 0;
        let selectedVoteTarget = null;
        let chosenPair = {};

        function startGame() {
            totalPlayers = parseInt(document.getElementById('numPlayers').value);
            spiesCount = parseInt(document.getElementById('numSpies').value);
            
            if (spiesCount >= totalPlayers) {
                alert("Spies must be less than total players!");
                return;
            }

            // Pick random word pair
            chosenPair = wordPairs[Math.floor(Math.random() * wordPairs.length)];
            
            // Assign roles
            let roles = Array(totalPlayers).fill('civilian');
            let assignedSpies = 0;
            while(assignedSpies < spiesCount) {
                let idx = Math.floor(Math.random() * totalPlayers);
                if(roles[idx] === 'civilian') {
                    roles[idx] = 'spy';
                    assignedSpies++;
                }
            }

            playersData = roles.map((role, i) => ({
                id: i + 1,
                role: role,
                word: role === 'spy' ? chosenPair.spy : chosenPair.civilian
            }));

            currentPlayerIndex = 0;
            document.getElementById('screen-setup').style.display = 'none';
            document.getElementById('screen-reveal').style.display = 'block';
            updateRevealScreen();
        }

        function updateRevealScreen() {
            document.getElementById('currentRevealPlayer').innerText = currentPlayerIndex + 1;
            document.getElementById('secretText').innerText = "🔒 Tap to Reveal";
            document.getElementById('nextPlayerBtn').style.display = 'none';
        }

        let isRevealed = false;
        function toggleWordVisibility() {
            let textEl = document.getElementById('secretText');
            if (!isRevealed) {
                textEl.innerText = playersData[currentPlayerIndex].word;
                isRevealed = true;
                document.getElementById('nextPlayerBtn').style.display = 'block';
            } else {
                textEl.innerText = "🔒 Tap to Reveal";
                isRevealed = false;
            }
        }

        function nextPlayerReveal() {
            isRevealed = false;
            currentPlayerIndex++;
            if (currentPlayerIndex < totalPlayers) {
                updateRevealScreen();
            } else {
                // Move to Voting Screen
                document.getElementById('screen-reveal').style.display = 'none';
                document.getElementById('screen-game').style.display = 'block';
                renderVotingList();
            }
        }

        function renderVotingList() {
            let container = document.getElementById('votingList');
            container.innerHTML = '<p style="font-size:12px;">Select player to vote out:</p>';
            playersData.forEach(p => {
                container.innerHTML += `<div class="player-chip" id="p-chip-${p.id}" onclick="selectPlayer(${p.id})">Player ${p.id}</div>`;
            });
        }

        function selectPlayer(id) {
            selectedVoteTarget = id;
            document.querySelectorAll('.player-chip').forEach(el => el.classList.remove('selected'));
            document.getElementById(`p-chip-${id}`).classList.add('selected');
        }

        function submitVote() {
            if (!selectedVoteTarget) {
                alert("Please select a player to vote!");
                return;
            }

            let votedPlayer = playersData.find(p => p.id === selectedVoteTarget);
            let resultMessage = "";

            if (votedPlayer.role === 'spy') {
                resultMessage = `🎉 Civilians Win! Player ${votedPlayer.id} was indeed the Spy (${chosenPair.spy})!`;
            } else {
                let actualSpies = playersData.filter(p => p.role === 'spy').map(p => `Player ${p.id}`).join(', ');
                resultMessage = `😢 Spy Wins! Player ${votedPlayer.id} was an innocent civilian. The actual Spy was ${actualSpies}!`;
            }

            document.getElementById('screen-game').style.display = 'none';
            document.getElementById('screen-result').style.display = 'block';
            document.getElementById('resultText').innerText = resultMessage;
        }

        function resetGame() {
            document.getElementById('screen-result').style.display = 'none';
            document.getElementById('screen-setup').style.display = 'block';
        }
    </script>
</body>
</html>
