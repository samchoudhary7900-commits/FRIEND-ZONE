<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Voice Lounge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #111827;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        
        /* Fullscreen Login Modal */
        #loginModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .login-card {
            background: #1f2937;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #374151;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .login-card h2 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #ec4899;
        }
        .tab-buttons {
            display: flex;
            margin: 15px 0;
            background: #111827;
            border-radius: 8px;
            padding: 3px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #ec4899;
            color: #fff;
        }
        .login-card input {
            width: 100%;
            background: #111827;
            border: 1px solid #4b5563;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            margin-bottom: 12px;
            outline: none;
            font-size: 14px;
        }
        .login-card input:focus {
            border-color: #ec4899;
        }

        /* VIP Seat Grid Layout */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-areas:
                "seat1 seat1"
                "seat2 seat3"
                "seat4 seat5";
            gap: 15px;
            text-align: center;
            margin: 15px auto;
            max-width: 250px;
        }
        .seat:nth-child(1) { grid-area: seat1; }
        .seat:nth-child(2) { grid-area: seat2; }
        .seat:nth-child(3) { grid-area: seat3; }
        .seat:nth-child(4) { grid-area: seat4; }
        .seat:nth-child(5) { grid-area: seat5; }

        .seat-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #1f2937;
            border: 2px dashed #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .seat-circle.occupied {
            background: #ec4899;
            border: 2px solid #f472b6;
        }
        .seat-name {
            font-size: 12px;
            color: #9ca3af;
            display: block;
        }

        /* Chat Section */
        .chat-box {
            flex: 1;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 10px;
            border: 1px solid #374151;
            max-height: 220px;
        }
        .chat-msg {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
        }
        .chat-msg .sender {
            color: #f472b6;
            font-weight: bold;
        }
        .chat-msg.gift-msg {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            color: #fff;
            font-weight: bold;
        }

        /* Controls Area */
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .controls input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .btn {
            background: #ec4899;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .gift-btn {
            background: #8b5cf6;
            font-size: 16px;
        }

        /* Gift Menu */
        .gift-menu {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 16px;
            padding: 12px;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .gift-item {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gift-item:hover {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <!-- ID Password Login / Sign Up Modal -->
    <div id="loginModal">
        <div class="login-card">
            <h2>🎙️ VIP Voice Lounge</h2>
            <p style="font-size: 12px; color: #9ca3af; margin: 0;">Enter ID & Password to Login</p>
            
            <div class="tab-buttons">
                <button id="loginTab" class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                <button id="signupTab" class="tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <input type="text" id="userIdInput" placeholder="User ID / Username">
            <input type="password" id="userPassInput" placeholder="Password">
            
            <button class="btn" style="width: 100%; border-radius: 10px; margin-top: 5px;" id="authSubmitBtn" onclick="handleAuth()">Login Now</button>
        </div>
    </div>

    <div class="container">
        <h3>🎙️ VIP Voice Lounge</h3>
        
        <!-- 5 Seats Layout -->
        <div class="seat-grid">
            <div class="seat">
                <div id="seat-1" class="seat-circle occupied">A</div>
                <span id="seat-1-name" class="seat-name">Admin</span>
            </div>
            <div class="seat" onclick="claimSeat(2)">
                <div id="seat-2" class="seat-circle">+</div>
                <span id="seat-2-name" class="seat-name">Seat 2</span>
            </div>
            <div class="seat" onclick="claimSeat(3)">
                <div id="seat-3" class="seat-circle">+</div>
                <span id="seat-3-name" class="seat-name">Seat 3</span>
            </div>
            <div class="seat" onclick="claimSeat(4)">
                <div id="seat-4" class="seat-circle">+</div>
                <span id="seat-4-name" class="seat-name">Seat 4</span>
            </div>
            <div class="seat" onclick="claimSeat(5)">
                <div id="seat-5" class="seat-circle">+</div>
                <span id="seat-5-name" class="seat-name">Seat 5</span>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-box" id="chatBox">
            <div class="chat-msg">
                <span class="sender">System:</span> Welcome to VIP Room! 🎉
            </div>
        </div>

        <!-- Gift Selector Popup -->
        <div class="gift-menu" id="giftMenu">
            <span class="gift-item" onclick="sendGift('🌹 Rose')">🌹</span>
            <span class="gift-item" onclick="sendGift('👑 Crown')">👑</span>
            <span class="gift-item" onclick="sendGift('🚀 Rocket')">🚀</span>
            <span class="gift-item" onclick="sendGift('🔥 Fire')">🔥</span>
        </div>

        <!-- Input Bar -->
        <div class="controls">
            <button class="btn gift-btn" onclick="toggleGiftMenu()">🎁</button>
            <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn" onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let authMode = "login";

        function switchAuthTab(mode) {
            authMode = mode;
            let loginTab = document.getElementById('loginTab');
            let signupTab = document.getElementById('signupTab');
            let submitBtn = document.getElementById('authSubmitBtn');

            if(mode === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                submitBtn.innerText = 'Login Now';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtn.innerText = 'Create Account';
            }
        }

        function handleAuth() {
            let userId = document.getElementById('userIdInput').value.trim();
            let pass = document.getElementById('userPassInput').value.trim();

            if (!userId || !pass) {
                alert("Kripya User ID aur Password dono enter karein!");
                return;
            }

            if (pass.length < 4) {
                alert("Password kam se kam 4 characters ka hona chahiye!");
                return;
            }

            currentUser = userId;
            document.getElementById('loginModal').style.display = 'none';
            addChatMessage("System", `${currentUser} successfully logged in! 🎉`, false);
        }

        function sendMsg() {
            let input = document.getElementById('msgInput');
            let msg = input.value.trim();
            if(!msg) return;

            addChatMessage(currentUser, msg, false);
            input.value = '';
        }

        function toggleGiftMenu() {
            let menu = document.getElementById('giftMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendGift(giftName) {
            toggleGiftMenu();
            addChatMessage(currentUser, `sent ${giftName} to Admin! ✨`, true);
        }

        function addChatMessage(sender, text, isGift) {
            let chatBox = document.getElementById('chatBox');
            let div = document.createElement('div');
            div.className = 'chat-msg' + (isGift ? ' gift-msg' : '');
            
            if(isGift) {
                div.innerHTML = `🎁 <b>${sender}</b> ${text}`;
            } else {
                div.innerHTML = `<span class="sender">${sender}:</span> ${text}`;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function claimSeat(seatNum) {
            let seat = document.getElementById(`seat-${seatNum}`);
            let name = document.getElementById(`seat-${seatNum}-name`);
            if(!seat.classList.contains('occupied')) {
                seat.classList.add('occupied');
                seat.innerText = currentUser.charAt(0).toUpperCase();
                name.innerText = currentUser;
                addChatMessage("System", `${currentUser} took Seat ${seatNum}`, false);
            }
        }
    </script>
</body>
</html>
