    <script>
        /* === NAVIGATION & MODAL SYSTEM === */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            let navBtn = document.getElementById('nav-' + tabId);
            if (navBtn) navBtn.classList.add('active');
        }

        function openGameModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
            if(modalId === 'drawModal') initPaintCanvas();
        }

        function closeGameModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function setAvatarStyle(name, icon) {
            document.getElementById('headerAvatarIcon').innerText = icon;
            document.getElementById('studioAvatarDisplay').innerText = icon;
            document.getElementById('profileAvatarBig').innerText = icon;
            alert(`Aapne ${name} outfit equip kar liya hai!`);
        }

        /* === WHO IS THE SPY LIVE LOGIC === */
        let spyTimer = 20;
        setInterval(() => {
            spyTimer--;
            if (spyTimer <= 0) {
                spyTimer = 20;
                let chatBox = document.getElementById('spyChatLog');
                chatBox.innerHTML += `<div class="chat-line-text judge">🧙 Nyayadheesh: Naya round shuru ho gaya hai! Sabhi naye clues dein.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            let timerEl = document.getElementById('spyTimerText');
            if (timerEl) timerEl.innerText = spyTimer + 's';
        }, 1000);

        function triggerSpyVote(seatNum) {
            let chatBox = document.getElementById('spyChatLog');
            chatBox.innerHTML += `<div class="chat-line-text">[Aapne] Seat [${seatNum}] ko vote diya hai!</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendSpyReaction(emojiName) {
            let chatBox = document.getElementById('spyChatLog');
            chatBox.innerHTML += `<div class="chat-line-text">[Aapne] Reaction bheja: ${emojiName}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Coins deduction effect
            let coinEl = document.getElementById('headerCoinVal');
            let currentCoins = parseInt(coinEl.innerText.replace(',', '')) - 10;
            coinEl.innerText = currentCoins.toLocaleString();
        }

        /* === 15x15 LUDO ARENA FULL FUNCTIONAL LOGIC === */
        const ludoPlayers = ['yellow', 'blue', 'green', 'red'];
        const ludoCards = { yellow: 'cardYellow', blue: 'cardBlue', green: 'cardGreen', red: 'cardRed' };
        const ludoScores = { yellow: 'scoreYellow', blue: 'scoreBlue', green: 'scoreGreen', red: 'scoreRed' };
        const ludoDices = { yellow: 'diceYellow', blue: 'diceBlue', green: 'diceGreen', red: 'diceRed' };
        
        let ludoTurnIdx = 0;
        let ludoPoints = { yellow: 0, blue: 0, green: 0, red: 0 };
        let isLudoRolling = false;

        function rollLudoDice(color) {
            if (isLudoRolling) return;
            let activeColor = ludoPlayers[ludoTurnIdx];

            if (color !== activeColor) {
                alert(`Abhi turn ${activeColor.toUpperCase()} ki hai! Kripya sahi dice click karein.`);
                return;
            }

            isLudoRolling = true;
            let rolledVal = Math.floor(Math.random() * 6) + 1;
            let diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

            document.getElementById(ludoDices[activeColor]).innerText = diceFaces[rolledVal - 1];
            document.getElementById('ludoStatusText').innerText = `${activeColor.toUpperCase()} ne ${rolledVal} roll kiya! Token aage badh raha hai...`;

            setTimeout(() => {
                ludoPoints[activeColor] += rolledVal;
                document.getElementById(ludoScores[activeColor]).innerText = ludoPoints[activeColor] + " pts";

                Object.values(ludoCards).forEach(id => document.getElementById(id).classList.remove('active-turn'));
                Object.values(ludoDices).forEach(id => document.getElementById(id).innerText = "🎲");

                ludoTurnIdx = (ludoTurnIdx + 1) % 4;
                let nextColor = ludoPlayers[ludoTurnIdx];

                document.getElementById(ludoCards[nextColor]).classList.add('active-turn');
                document.getElementById('ludoStatusText').innerText = `🎲 Ab ${nextColor.toUpperCase()} ki turn hai! Dice click karein.`;
                isLudoRolling = false;
            }, 800);
        }

        /* === DRAW & GUESS CANVAS LOGIC === */
        let canvas, ctx, painting = false, currentColor = "#000";

        function initPaintCanvas() {
            canvas = document.getElementById('paintCanvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            
            canvas.onmousedown = startDraw;
            canvas.onmouseup = stopDraw;
            canvas.onmousemove = drawLine;

            canvas.ontouchstart = startDraw;
            canvas.ontouchend = stopDraw;
            canvas.ontouchmove = drawLine;
        }

        function setDrawColor(col) { currentColor = col; }
        function clearCanvas() { if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function startDraw(e) { painting = true; drawLine(e); }
        function stopDraw() { painting = false; if(ctx) ctx.beginPath(); }

        function drawLine(e) {
            if (!painting || !ctx) return;
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
                </script>
