<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Is The Spy - WePlay Style</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0c192c; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 420px; background: linear-gradient(180deg, #1d68d8 0%, #123e88 50%, #0b224e 100%); min-height: 100vh; display: flex; flex-direction: column; position: relative; justify-content: space-between; overflow: hidden; }

        /* Top Header & Banner */
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px; position: relative; }
        .timer-pill { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .category-card { background: rgba(255,255,255,0.18); backdrop-filter: blur(10px); border-radius: 12px; padding: 8px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.25); box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: absolute; left: 50%; transform: translateX(-50%); top: 10px; width: 60%; }
        .category-card h4 { margin: 0; font-size: 12px; color: #a5f3fc; }
        .category-card p { margin: 2px 0 0 0; font-size: 14px; font-weight: bold; color: #fff; }

        /* Main Game Arena / Center Status */
        .speaker-status { text-align: center; margin-top: 25px; font-size: 16px; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 0.5px; }

        /* Seats Grid (Left & Right 6 Seats Layout) */
        .seats-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 100px; padding: 10px 20px; margin-top: 10px; position: relative; }
        .seat-item { display: flex; flex-direction: column; align-items: center; position: relative; }
        .seat-item:nth-child(even) { align-items: center; }

        .avatar-wrapper { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); position: relative; display: flex; align-items: center; justify-content: center; background: #1e293b; background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .avatar-wrapper.speaking { border-color: #38bdf8; animation: pulseMic 1.2s infinite; }
        @keyframes pulseMic { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }

        .seat-num { position: absolute; top: -2px; left: -2px; background: #0284c7; color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; }
        .role-badge { position: absolute; top: -6px; right: -10px; background: #06b6d4; color: #fff; font-size: 8px; padding: 1px 6px; border-radius: 8px; border: 1px solid #fff; }
        .speaking-icon { position: absolute; left: -35px; top: 10px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 50%; font-size: 16px; }

        .player-name { font-size: 12px; margin-top: 4px; color: #e2e8f0; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.8); max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Center Gifts Display */
        .gifts-center-row { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
        .gift-bubble { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border-radius: 50%; width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.3); position: relative; }
        .gift-bubble span { font-size: 18px; }
        .gift-count { position: absolute; bottom: -8px; background: #fef08a; color: #854d0e; font-size: 9px; font-weight: bold; padding: 1px 6px; border-radius: 10px; }

        /* System Messages Chat Box */
        .system-chat-box { background: rgba(11, 27, 58, 0.7); backdrop-filter: blur(10px); border-radius: 12px 12px 0 0; padding: 10px; margin: 0 10px; border: 1px solid rgba(255,255,255,0.1); max-height: 110px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .chat-line { color: #93c5fd; }
        .chat-line.judge { color: #facc15; font-weight: bold; }

        /* Bottom Emoji & Reaction Keyboard Sheet */
        .bottom-action-sheet { background: #121826; border-top: 1px solid #1e293b; padding: 10px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; text-align: center; border-radius: 16px 16px 0 0; }
        .emoji-item { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .emoji-item span { font-size: 24px; display: block; margin-bottom: 2px; }
        .emoji-item p { margin: 0; font-size: 9px; color: #9ca3af; }
    </style>
</head>
